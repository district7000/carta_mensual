<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">Diciembre: Mes de la Prevención y Tratamiento de Enfermedades</title>
  <desc id="d">Ilustración de un escudo con una cruz de salud, rodeado de pequeñas figuras de personas, junto al texto del mes.</desc>
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#005daa"/>
      <stop offset="0.65" stop-color="#17458f"/>
      <stop offset="1" stop-color="#0b2c63"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.78" cy="0.4" r="0.45">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#f)"/>
  <rect width="1200" height="520" fill="url(#luz)"/>
  <text x="70" y="115" font-family="Source Sans 3, Segoe UI, sans-serif" font-weight="700" font-size="26" letter-spacing="5" fill="#f7a81b">DICIEMBRE · ROTARY INTERNATIONAL</text>
  <text x="70" y="190" font-family="Merriweather, Georgia, serif" font-weight="900" font-size="54" fill="#ffffff">Mes de la Prevención</text>
  <text x="70" y="256" font-family="Merriweather, Georgia, serif" font-weight="900" font-size="54" fill="#ffffff">y Tratamiento</text>
  <text x="70" y="322" font-family="Merriweather, Georgia, serif" font-weight="900" font-size="54" fill="#ffffff">de Enfermedades</text>
  <text x="70" y="380" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="27" fill="#dce7f6">Una enfermedad evitada es una vida que sigue su curso.</text>
  <!-- escudo -->
  <path d="M930 70 L1060 115 L1060 230 C1060 320, 1000 380, 930 410 C860 380, 800 320, 800 230 L800 115 Z" fill="#00778b" stroke="#f7a81b" stroke-width="8"/>
  <rect x="905" y="160" width="50" height="160" rx="8" fill="#ffffff"/>
  <rect x="850" y="215" width="160" height="50" rx="8" fill="#ffffff"/>
  <!-- personas -->
  <g fill="#f7a81b">
    <circle cx="720" cy="400" r="18"/><path d="M695 470 C695 432, 745 432, 745 470 Z"/>
    <circle cx="1140" cy="400" r="18"/><path d="M1115 470 C1115 432, 1165 432, 1165 470 Z"/>
  </g>
  <g fill="#cfe0f5">
    <circle cx="790" cy="430" r="14"/><path d="M770 470 C770 442, 810 442, 810 470 Z"/>
    <circle cx="1070" cy="430" r="14"/><path d="M1050 470 C1050 442, 1090 442, 1090 470 Z"/>
  </g>
  <rect x="0" y="470" width="1200" height="50" fill="#0b2c63"/>
  <rect x="0" y="466" width="1200" height="6" fill="#f7a81b"/>
</svg>
